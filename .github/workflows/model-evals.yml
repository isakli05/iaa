name: model-evals

# Layer B — real-model plugin evals. NEVER on push, never scheduled — manual
# dispatch only (IAA-BL-022). Hosted model evals are cost-controlled
# and require an explicitly configured compatible auth/provider/CLI
# environment (the CLAUDE_EVAL_CREDENTIALS secret); an explicitly started
# but unconfigured run fails loudly below rather than reporting a misleading
# green result.
on:
  workflow_dispatch:
    inputs:
      cases:
        description: "case name glob (default: all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require eval credentials
        env:
          EVAL_CREDENTIALS: ${{ secrets.CLAUDE_EVAL_CREDENTIALS }}
        run: |
          if [ -z "$EVAL_CREDENTIALS" ]; then
            echo "CLAUDE_EVAL_CREDENTIALS secret not set — model evals cannot run." >&2
            exit 1
          fi
          mkdir -p "$HOME/.claude"
          printf '%s' "$EVAL_CREDENTIALS" > "$HOME/.claude/.credentials.json"

      - name: Run the gate2 trigger suite against packaging/claude
        timeout-minutes: 120
        env:
          CASES: ${{ github.event.inputs.cases }}
        run: |
          ARGS=""
          if [ -n "$CASES" ] && [ "$CASES" != "*" ]; then
            ARGS="--case $CASES"
          fi
          release-hardening/evals/gate2/run-gate2-trigger-suite.sh "$RUNNER_TEMP/eval-results" $ARGS

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: ${{ runner.temp }}/eval-results/
